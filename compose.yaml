services:
  observer:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (shared Postgres from the agent-infra repo)}
    networks: [agent-infra]
    restart: unless-stopped

networks:
  agent-infra:
    external: true
